name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    environment: Builder

    steps:
      - uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.x'
          otp-version: '28.x'

      # _build is cached so the MIX_ENV=test compile artifacts survive runs;
      # deps covers the dependency downloads.
      - name: Restore dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: test-${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Compile once, in the same MIX_ENV the tests use, so coveralls does not
      # recompile the whole project in a fresh _build.
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Prepare test database
        run: mix do ecto.create --quiet + ecto.migrate --quiet
        env:
          MIX_ENV: test
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      # The single test run: fails the job on test failure (pipefail), posts
      # the Coveralls status, and leaves the output for the threshold check —
      # no separate re-run just to read the total.
      - name: Run tests with coverage
        run: |
          set -o pipefail
          mix coveralls.github | tee coveralls.out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
          MIX_ENV: test
          DISCORD_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}

      - name: Verify minimum coverage
        run: |
          COVERAGE=$(grep "\[TOTAL\]" coveralls.out | awk '{print $2}' | sed 's/%//')
          MINIMUM=80.0

          if (( $(echo "$COVERAGE < $MINIMUM" | bc -l) )); then
            echo "Test coverage is below minimum: $COVERAGE% < $MINIMUM%"
            exit 1
          else
            echo "Coverage is $COVERAGE%, which meets the minimum requirement of $MINIMUM%"
          fi

      - name: Run Credo
        run: mix credo --strict

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    environment: Builder
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soundbored:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/soundbored:${{ github.sha }}
            ghcr.io/${{ github.repository }}/soundbored:latest
            ghcr.io/${{ github.repository }}/soundbored:${{ github.sha }}

  docs:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.x'
          otp-version: '28.x'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: test-${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: test-${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Generate documentation
        run: mix docs

      - name: Deploy documentation to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: doc
          enable_jekyll: false
